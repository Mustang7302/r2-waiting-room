name: Settings

on:
  workflow_dispatch:
    inputs:
      heartbeat:
        description: "Check-in push after every poll ('Checked, no change')"
        type: choice
        options: [keep, on, off]
        default: keep
      full_vin:
        description: "Show the full VIN on the public dashboard (default hides the last 3 characters)"
        type: choice
        options: [keep, show, hide]
        default: keep

concurrency:
  group: r2wr-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m app.settings_cli --heartbeat "${{ inputs.heartbeat }}" --full-vin "${{ inputs.full_vin }}"
      - name: Commit
        run: |
          git config user.name "r2-waiting-room[bot]"
          git config user.email "r2-waiting-room@users.noreply.github.com"
          git add settings.json
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "settings: heartbeat=${{ inputs.heartbeat }} full_vin=${{ inputs.full_vin }}"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
