name: Poll Rivian

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "Use the sample order instead of Rivian (to check the dashboard before signing in)"
        type: boolean
        default: false

concurrency:
  group: r2wr-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll
        id: poll
        continue-on-error: true
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          MOCK_RIVIAN: ${{ inputs.mock == true && '1' || '0' }}
        run: python -m app.poller

      - name: Commit dashboard data
        run: |
          git config user.name "r2-waiting-room[bot]"
          git config user.email "r2-waiting-room@users.noreply.github.com"
          git add -A state docs/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "poll: $(date -u +%Y-%m-%dT%H:%MZ) rung $(python -c "import json;print(json.load(open('docs/data/meta.json')).get('rung','?'))")"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Fail the run if the poll failed
        if: steps.poll.outcome == 'failure'
        run: |
          echo "::error::Poll failed. If the dashboard says the session expired, run the Login workflow (start, then finish)."
          exit 1
